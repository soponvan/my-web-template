<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - ระบบจัดการฟาร์มแกะและแพะ กองบิน 23</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@100;200;300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Sarabun', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0d1a10 0%, #162a1c 35%, #1a2e21 70%, #08100b 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated background orbs */
        body::before {
            content: '';
            position: fixed;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.15) 0%, transparent 70%);
            top: -150px;
            left: -150px;
            border-radius: 50%;
            animation: floatOrb 8s ease-in-out infinite;
        }

        body::after {
            content: '';
            position: fixed;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(5, 150, 105, 0.1) 0%, transparent 70%);
            bottom: -100px;
            right: -100px;
            border-radius: 50%;
            animation: floatOrb 10s ease-in-out infinite reverse;
        }

        @keyframes floatOrb {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            50% {
                transform: translate(30px, -30px) scale(1.05);
            }
        }

        /* Floating particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: rgba(148, 163, 184, 0.4);
            border-radius: 50%;
            animation: particleFloat linear infinite;
        }

        @keyframes particleFloat {
            0% {
                transform: translateY(100vh) translateX(0);
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            100% {
                transform: translateY(-100px) translateX(60px);
                opacity: 0;
            }
        }

        .login-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
            padding: 20px;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
            padding: 48px 40px 40px;
            box-shadow:
                0 32px 80px rgba(0, 0, 0, 0.5),
                0 0 0 1px rgba(255, 255, 255, 0.05) inset,
                0 1px 0 rgba(255, 255, 255, 0.12) inset;
        }

        .logo-area {
            text-align: center;
            margin-bottom: 36px;
        }

        .logo-icon {
            width: 92px;
            height: 92px;
            background: linear-gradient(135deg, #10b981 0%, #059669 50%, #064e3b 100%);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            font-size: 34px;
            line-height: 0.9;
            margin: 0 auto 16px;
            box-shadow: 0 12px 40px rgba(16, 185, 129, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.1) inset;
            animation: iconPulse 3s ease-in-out infinite;
        }

        .logo-icon span {
            display: block;
            height: 38px;
        }

        @keyframes iconPulse {

            0%,
            100% {
                box-shadow: 0 12px 40px rgba(16, 185, 129, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.1) inset;
            }

            50% {
                box-shadow: 0 12px 60px rgba(16, 185, 129, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.1) inset;
            }
        }

        .logo-area h1 {
            font-size: 1.25rem;
            font-weight: 700;
            color: #FDD771;
            letter-spacing: 0;
            white-space: nowrap;
            margin-bottom: 6px;
        }

        .logo-area p {
            font-size: 0.85rem;
            color: #FDD771;
            font-weight: 300;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 500;
            color: #FDD771;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1rem;
            opacity: 0.5;
            pointer-events: none;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px 14px 46px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            color: #FDD771;
            font-size: 0.95rem;
            font-family: 'Sarabun', sans-serif;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-group input::placeholder {
            color: rgba(253, 215, 113, 0.4);
        }

        .form-group input:focus {
            border-color: rgba(16, 185, 129, 0.7);
            background: rgba(16, 185, 129, 0.08);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15), 0 4px 20px rgba(16, 185, 129, 0.2);
        }

        .login-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #10b981 0%, #059669 50%, #047857 100%);
            color: #FDD771;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            font-family: 'Sarabun', sans-serif;
            cursor: pointer;
            margin-top: 8px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(16, 185, 129, 0.4);
            letter-spacing: 0.3px;
        }

        .login-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
            transition: left 0.5s;
        }

        .login-btn:hover::before {
            left: 100%;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(16, 185, 129, 0.55);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.875rem;
            margin-bottom: 20px;
            display: none;
            border: 1px solid;
        }

        .alert.error {
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .alert.success {
            background: rgba(34, 197, 94, 0.1);
            border-color: rgba(34, 197, 94, 0.3);
            color: #86efac;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            margin: 28px 0 20px;
        }

        .info-box {
            background: rgba(16, 185, 129, 0.06);
            border: 1px solid rgba(16, 185, 129, 0.15);
            border-radius: 12px;
            padding: 14px 16px;
        }

        .info-box p {
            font-size: 0.78rem;
            color: #FDD771;
            line-height: 1.7;
        }

        .info-box strong {
            color: rgba(196, 181, 253, 0.9);
        }

        .version-badge {
            text-align: center;
            margin-top: 24px;
            font-size: 0.72rem;
            color: #FDD771;
            opacity: 0.6;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 36px 20px 32px;
            }

            .logo-area h1 {
                font-size: 0.9rem;
            }

            .logo-area p {
                font-size: 0.76rem;
                white-space: nowrap;
            }
        }

        /* Loading spinner */
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <!-- Floating particles -->
    <div class="particles" id="particles"></div>

    <div class="login-wrapper">
        <div class="login-card">
            <div class="logo-area">
                <div class="logo-icon" aria-label="แกะและแพะ">
                    <span>🐑</span>
                    <span>🐐</span>
                </div>
                <h1>ระบบจัดการฟาร์มแกะและแพะ บน.23</h1>
                <p>Sheep & Goat Farm Management System Wing 23</p>
            </div>

            <div class="alert" id="alert-box"></div>

            <div class="form-group">
                <label>ชื่อผู้ใช้</label>
                <div class="input-wrapper">
                    <span class="input-icon">👤</span>
                    <input type="text" id="username" placeholder="กรอกชื่อผู้ใช้" autocomplete="username" autofocus>
                </div>
            </div>

            <div class="form-group">
                <label>รหัสผ่าน</label>
                <div class="input-wrapper">
                    <span class="input-icon">🔒</span>
                    <input type="password" id="password" placeholder="กรอกรหัสผ่าน" autocomplete="current-password">
                </div>
            </div>

            <button class="login-btn" id="login-btn" onclick="doLogin()">
                เข้าสู่ระบบ
            </button>

            <div class="divider"></div>

            <div class="info-box">
                <p>⚙️ บัญชีเริ่มต้น: <strong>ติดต่อ ร.ต.โสภณ วันดี</strong> / <strong>45266</strong><br>
                    กรุณาเปลี่ยนรหัสผ่านหลังจากเข้าสู่ระบบครั้งแรก</p>
            </div>
        </div>

        <div class="version-badge">
            🐑 Sheep Farm Management wing 23 V1.0 &nbsp;|&nbsp; © 2026
            <br>
            ผู้พัฒนา : ร.ต.โสภณ วันดี ตำแหน่ง นทสส.ฝทสส.บก.บน.23
        </div>
    </div>

    <script>
        // Generate floating particles
        const container = document.getElementById('particles');
        for (let i = 0; i < 25; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.cssText = `
                left: ${Math.random() * 100}%;
                width: ${Math.random() * 3 + 1}px;
                height: ${Math.random() * 3 + 1}px;
                opacity: ${Math.random() * 0.5 + 0.1};
                animation-duration: ${Math.random() * 15 + 10}s;
                animation-delay: ${Math.random() * 10}s;
            `;
            container.appendChild(p);
        }

        function showAlert(message, type) {
            const box = document.getElementById('alert-box');
            const icon = type === 'error' ? '❌' : '✅';
            box.textContent = `${icon}  ${message}`;
            box.className = `alert ${type}`;
            box.style.display = 'flex';
            if (type === 'success') {
                setTimeout(() => box.style.display = 'none', 4000);
            }
        }

        async function doLogin() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('login-btn');

            if (!username || !password) {
                showAlert('กรุณากรอกชื่อผู้ใช้และรหัสผ่าน', 'error');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span>กำลังตรวจสอบ...';

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (data.status === 'success') {
                    showAlert(data.message, 'success');
                    btn.innerHTML = '✅ เข้าสู่ระบบสำเร็จ กำลังโหลด...';
                    setTimeout(() => window.location.href = '/', 800);
                } else {
                    showAlert(data.message, 'error');
                    btn.disabled = false;
                    btn.innerHTML = 'เข้าสู่ระบบ';
                    document.getElementById('password').value = '';
                    document.getElementById('password').focus();
                }
            } catch (e) {
                showAlert('ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้', 'error');
                btn.disabled = false;
                btn.innerHTML = 'เข้าสู่ระบบ';
            }
        }

        // Enter key support
        document.addEventListener('keydown', e => {
            if (e.key === 'Enter') doLogin();
        });
    </script>
</body>

</html>
